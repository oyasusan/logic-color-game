<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LOGIC COLOR</title>
<style>
  :root {
    --bg: #070a12;
    --panel: #101827;
    --panel-2: #161f33;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8f1ff;
    --text-dim: #8a97b3;
    --blue: #29e0ff;
    --red: #ff3f6b;
    --green: #43ffa0;
    --gold: #ffd54a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }

  .hidden { display: none !important; }

  /* ---------- 画面切り替え ---------- */
  .screen {
    display: none;
    min-height: 100vh;
    padding: calc(var(--safe-top) + 10px) 14px calc(var(--safe-bottom) + 10px);
  }

  .screen.active {
    display: flex;
    flex-direction: column;
  }

  .neon-title {
    margin: 0;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--blue), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(41, 224, 255, 0.35);
  }

  .primary-btn {
    padding: 12px 28px;
    border-radius: 12px;
    border: 1px solid var(--blue);
    background: var(--blue);
    color: #04101c;
    font-weight: 800;
    letter-spacing: 1px;
    font-size: 14px;
  }

  .ghost-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* ---------- TITLE ---------- */
  #screen-title {
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
  }

  #screen-title .neon-title { font-size: 34px; }

  #titleLevelLabel {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--gold);
  }

  /* ---------- STAGE SELECT ---------- */
  #screen-stageselect .select-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  #screen-stageselect .select-header h2 {
    flex: 1;
    margin: 0;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-align: center;
  }

  .stage-card,
  #tutorialCard,
  #dailyPuzzleCard {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    min-height: 84px;
  }

  #tutorialCard,
  #dailyPuzzleCard {
    width: 100%;
    margin-bottom: 10px;
  }

  #tutorialCard { border-color: var(--gold); }
  #tutorialCard .stage-card-name { color: var(--gold); font-weight: 800; letter-spacing: 2px; }
  #tutorialCard.completed { opacity: 0.6; }

  #dailyPuzzleCard { border-color: var(--blue); margin-bottom: 14px; }
  #dailyPuzzleCard .stage-card-name { color: var(--blue); font-weight: 800; letter-spacing: 2px; }

  #stageGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .stage-card-name { font-weight: 700; font-size: 13px; letter-spacing: 1px; }
  .stage-card-diff { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
  .stage-card-stars { font-size: 13px; color: var(--gold); min-height: 16px; }
  .stage-card-time { font-size: 10px; color: var(--text-dim); min-height: 12px; }

  .stage-card.locked {
    opacity: 0.4;
  }

  .stage-card.completed {
    border-color: var(--green);
  }

  .stage-card:disabled {
    cursor: not-allowed;
  }

  /* ---------- GAME: 上部 ---------- */
  #screen-game .game-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  #stageLabel {
    flex: 1;
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  #stageBestStars {
    font-size: 12px;
    color: var(--gold);
    min-width: 40px;
    text-align: right;
  }

  #tutorialBanner {
    background: var(--panel-2);
    border: 1px solid var(--gold);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  /* ---------- GAME: 中央 ---------- */
  #screen-game main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 0;
  }

  #statusBar {
    display: flex;
    gap: 18px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .board-wrapper {
    display: grid;
    gap: 4px;
    width: min(100%, 480px);
    aspect-ratio: 1 / 1;
  }

  .corner-cell {
    background: transparent;
  }

  .hint-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 3px;
    padding: 2px;
  }

  .hint-col { flex-direction: column; }
  .hint-row { flex-direction: row; }

  .hint-chip {
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #04101c;
    opacity: 0.9;
    transition: opacity 0.2s, transform 0.2s;
  }

  .chip-blue  { background: var(--blue); }
  .chip-red   { background: var(--red); }
  .chip-green { background: var(--green); }

  .hint-chip.satisfied {
    opacity: 0.28;
    transform: scale(0.9);
    text-decoration: line-through;
  }

  .board-cell {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0;
    margin: 0;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
  }

  .board-cell:active {
    transform: scale(0.94);
  }

  .board-cell.lit.color-blue {
    background: radial-gradient(circle, rgba(41,224,255,0.9), rgba(41,224,255,0.4));
    box-shadow: 0 0 10px 2px var(--blue), inset 0 0 8px rgba(255,255,255,0.4);
  }

  .board-cell.lit.color-red {
    background: radial-gradient(circle, rgba(255,63,107,0.9), rgba(255,63,107,0.4));
    box-shadow: 0 0 10px 2px var(--red), inset 0 0 8px rgba(255,255,255,0.4);
  }

  .board-cell.lit.color-green {
    background: radial-gradient(circle, rgba(67,255,160,0.9), rgba(67,255,160,0.4));
    box-shadow: 0 0 10px 2px var(--green), inset 0 0 8px rgba(255,255,255,0.4);
  }

  .board-cell.flash {
    animation: flashPulse 0.35s ease-out;
  }

  @keyframes flashPulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.9); }
    50%  { box-shadow: 0 0 22px 8px rgba(255,255,255,0.8); }
    100% { box-shadow: 0 0 10px 2px currentColor; }
  }

  /* ---------- GAME: 下部 ---------- */
  #screen-game footer {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* マスをタップした時の色の巡回順を示す非インタラクティブな凡例 */
  .color-legend {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .legend-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    display: inline-block;
  }

  .legend-dot.legend-blue  { background: var(--blue);  box-shadow: 0 0 6px var(--blue); border-color: var(--blue); }
  .legend-dot.legend-red   { background: var(--red);   box-shadow: 0 0 6px var(--red); border-color: var(--red); }
  .legend-dot.legend-green { background: var(--green); box-shadow: 0 0 6px var(--green); border-color: var(--green); }

  .legend-arrow {
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 2px;
  }

  .action-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .action-buttons button {
    flex: 1;
    max-width: 140px;
    padding: 12px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 13px;
  }

  .action-buttons button:active {
    transform: scale(0.96);
  }

  /* ---------- クリア演出 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 12, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .clear-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 0 40px rgba(41, 224, 255, 0.25);
    max-width: 320px;
  }

  #clearTitle {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--blue), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }

  #clearStars {
    font-size: 26px;
    color: var(--gold);
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  #clearStats {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  #clearExp {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  .clear-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  #nextStageFromClearBtn {
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #00200f;
    font-weight: 800;
    letter-spacing: 1px;
  }

  #stageSelectFromClearBtn {
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-weight: 700;
    letter-spacing: 1px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 16px);
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 20;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <!-- ============ TITLE ============ -->
  <section id="screen-title" class="screen active">
    <h1 class="neon-title">LOGIC COLOR</h1>
    <div id="titleLevelLabel">LOGIC LEVEL Lv.1</div>
    <button type="button" id="titleStartBtn" class="primary-btn">STAGE SELECT</button>
  </section>

  <!-- ============ STAGE SELECT ============ -->
  <section id="screen-stageselect" class="screen">
    <div class="select-header">
      <button type="button" id="backToTitleBtn" class="ghost-btn">‹ TITLE</button>
      <h2>STAGE SELECT</h2>
      <span style="width:56px"></span>
    </div>
    <button type="button" id="tutorialCard">
      <div class="stage-card-name">TUTORIAL</div>
      <div class="stage-card-status">START</div>
    </button>
    <button type="button" id="dailyPuzzleCard">
      <div class="stage-card-name">DAILY PUZZLE</div>
      <div id="dailyPuzzleDate" class="stage-card-diff"></div>
    </button>
    <div id="stageGrid"></div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <header class="game-header">
      <button type="button" id="gameBackBtn" class="ghost-btn">‹ BACK</button>
      <span id="stageLabel">STAGE</span>
      <span id="stageBestStars"></span>
    </header>

    <main>
      <div id="tutorialBanner" class="hidden"></div>
      <div id="statusBar">
        <span id="moveCount">MOVES: 0</span>
        <span id="timer">TIME: 00:00</span>
      </div>
      <div id="boardWrapper" class="board-wrapper"></div>
    </main>

    <footer>
      <div id="colorLegend" class="color-legend"></div>
      <div class="action-buttons">
        <button type="button" id="undoBtn">UNDO</button>
        <button type="button" id="resetBtn">RESET</button>
        <button type="button" id="hintBtn">HINT</button>
      </div>
    </footer>
  </section>

  <!-- ============ CLEAR ============ -->
  <div id="clearOverlay" class="overlay hidden">
    <div class="clear-card">
      <div id="clearTitle">STAGE CLEAR!</div>
      <div id="clearStars"></div>
      <div id="clearStats"></div>
      <div id="clearExp" class="hidden"></div>
      <div class="clear-buttons">
        <button type="button" id="stageSelectFromClearBtn">STAGE SELECT</button>
        <button type="button" id="nextStageFromClearBtn">NEXT STAGE</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="src/board.js"></script>
  <script src="src/solver.js"></script>
  <script src="src/difficulty.js"></script>
  <script src="src/seed.js"></script>
  <script src="src/generator.js"></script>
  <script src="src/puzzleManager.js"></script>
  <script src="src/score.js"></script>
  <script src="src/progress.js"></script>
  <script src="src/stage.js"></script>
  <script src="src/tutorial.js"></script>
  <script src="src/game.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
